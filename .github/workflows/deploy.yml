name: Deploy portfolio to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble Portfolio 4 source
        run: |
          cat source-bundle/part-*.txt > /tmp/portfolio-v4.zip.b64
          base64 -d /tmp/portfolio-v4.zip.b64 > /tmp/portfolio-v4.zip
          mkdir -p /tmp/site
          unzip -q /tmp/portfolio-v4.zip -d /tmp/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site/arjun-rose-portfolio-v4
      - id: deployment
        uses: actions/deploy-pages@v4

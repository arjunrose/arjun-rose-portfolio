name: Publish Portfolio 4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Portfolio 4 files
        run: |
          cat source-v4/chunk-*.txt > /tmp/portfolio-v4.tar.xz.b64
          base64 -d /tmp/portfolio-v4.tar.xz.b64 > /tmp/portfolio-v4.tar.xz
          mkdir -p /tmp/portfolio-v4
          tar -xJf /tmp/portfolio-v4.tar.xz -C /tmp/portfolio-v4
          cp -a /tmp/portfolio-v4/arjun-rose-portfolio-v4/. .
          git rm -r --ignore-unmatch source-v4 source-bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Portfolio 4 source"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

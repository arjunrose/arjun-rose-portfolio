name: Deploy Portfolio 4 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Portfolio 4
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Portfolio 4
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Portfolio 4
        id: deployment
        uses: actions/deploy-pages@v4
